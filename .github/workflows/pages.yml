name: Deploy Jekyll site to Pages

# Manual-only. The repo is private and GitHub Pages is intentionally unpublished
# (the docs contain Citrix-internal methodology). The automatic push trigger is
# removed so pushes don't kick off deploy runs that fail with Pages disabled.
# To republish: re-enable Pages on the repo, then run this workflow manually
# (Actions tab -> this workflow -> Run workflow). NOTE: republishing makes the
# site PUBLIC again — this plan has no private-Pages option.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
